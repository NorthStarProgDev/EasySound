[package]
name = "easysound"
version = "1.2.0"
edition = "2021"
description = "EasySound — lightweight EasyEffects-style audio effects for Windows"
license = "MIT"
authors = ["NorthStar"]
readme = "README.md"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
cpal = "0.15"
anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
